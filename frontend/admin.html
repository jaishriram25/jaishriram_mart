
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Mart - Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f5f9;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            margin-top: 7px;
            color: #cbd5e1;
        }

        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 16px;
        }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            margin-bottom: 22px;
        }

        h2 {
            margin-bottom: 18px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            margin-top: 15px;
        }

        .refresh-btn {
            background: #e2e8f0;
            color: #172554;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .table-wrap {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        .status {
            margin-top: 14px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Jai Mart Admin Panel</h1>
    <p>Manage your products in one place</p>
</header>

<main>

    <section class="panel">
        <h2>Add New Product</h2>

        <form id="product-form">
            <div class="form-grid">
                <input id="name" placeholder="Product name" required>

                <input id="price" type="number" min="0.01"
                       step="0.01" placeholder="Price (₹)" required>

                <input id="category" placeholder="Category" required>

                <input id="quantity" type="number" min="0"
                       step="1" placeholder="Stock quantity" required>

                <input id="image" placeholder="Image filename or URL">

                <textarea id="description"
                          placeholder="Product description"></textarea>
            </div>

            <button class="add-btn" id="add-btn" type="submit">
                Add Product
            </button>

            <p id="status" class="status" role="status"></p>
        </form>
    </section>

    <section class="panel">
        <h2>Products</h2>

        <button class="refresh-btn" id="refresh-btn" type="button">
            Refresh Products
        </button>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="product-list">
                    <tr>
                        <td colspan="6">Loading products...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
    const API = "http://localhost:8080/api/products";

    const form = document.getElementById("product-form");
    const statusBox = document.getElementById("status");
    const productList = document.getElementById("product-list");
    const addButton = document.getElementById("add-btn");

    // LOAD PRODUCTS

    async function loadProducts() {
        productList.replaceChildren();

        const loadingRow = document.createElement("tr");
        const loadingCell = document.createElement("td");
        loadingCell.colSpan = 6;
        loadingCell.textContent = "Loading products...";
        loadingRow.appendChild(loadingCell);
        productList.appendChild(loadingRow);

        try {
            const response = await fetch(API);

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const products = await response.json();

            if (!Array.isArray(products)) {
                throw new Error("Invalid products response");
            }

            productList.replaceChildren();

            if (products.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 6;
                cell.textContent = "No products found.";
                row.appendChild(cell);
                productList.appendChild(row);
                return;
            }

            products.forEach(product => {
                const row = document.createElement("tr");

                [
                    product.id,
                    product.name,
                    "₹" + product.price,
                    product.category,
                    product.quantity
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", () => {
                    deleteProduct(product.id, product.name, deleteButton);
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);
                productList.appendChild(row);
            });

        } catch (error) {
            productList.replaceChildren();

            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 6;
            cell.textContent =
                "Could not load products. Check whether backend is running.";

            row.appendChild(cell);
            productList.appendChild(row);

            console.error(error);
        }
    }

    // DELETE PRODUCT

    async function deleteProduct(id, name, button) {
        const confirmed = confirm(
            'Delete "' + name + '"?\n\n' +
            "If this product has existing orders, it will be kept " +
            "for order history and its stock will be set to zero."
        );

        if (!confirmed) return;

        button.disabled = true;
        statusBox.textContent = "Processing product...";

        try {
            const response = await fetch(API + "/" + encodeURIComponent(id), {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok || result.success !== true) {
                throw new Error(result.message || "Could not process product.");
            }

            statusBox.textContent = result.message;

            await loadProducts();

        } catch (error) {
            statusBox.textContent =
                "Error: " + error.message +
                ". Check the backend and DELETE API.";

            console.error("Delete error:", error);
            button.disabled = false;
        }
    }

    // ADD PRODUCT

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const product = {
            name: document.getElementById("name").value.trim(),
            price: Number(document.getElementById("price").value),
            category: document.getElementById("category").value.trim(),
            quantity: Number(document.getElementById("quantity").value),
            image: document.getElementById("image").value.trim(),
            description: document.getElementById("description").value.trim()
        };

        if (
            !product.name ||
            !product.category ||
            !Number.isFinite(product.price) ||
            product.price <= 0 ||
            !Number.isInteger(product.quantity) ||
            product.quantity < 0
        ) {
            statusBox.textContent = "Please enter valid product details.";
            return;
        }

        addButton.disabled = true;
        statusBox.textContent = "Adding product...";

        try {
            const response = await fetch(API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            const result = await response.json();

            if (!response.ok || result.success !== true) {
                throw new Error(result.message || "Could not add product.");
            }

            statusBox.textContent =
                "Product added successfully! ID: " + result.id;

            form.reset();
            await loadProducts();

        } catch (error) {
            statusBox.textContent = "Error: " + error.message;
            console.error("Add product error:", error);

        } finally {
            addButton.disabled = false;
        }
    });

    document.getElementById("refresh-btn")
        .addEventListener("click", loadProducts);

    loadProducts();
</script>

</body>
</html>

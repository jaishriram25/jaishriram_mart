```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JAI MART - Create Account</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: #f1f5f9;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 7%;
            background: #0b1728;
            border-bottom: 1px solid #1e3048;
        }

        .logo {
            color: #38bdf8;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .register-wrapper {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 18px;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(14, 165, 233, 0.12),
                    transparent 35%
                ),
                #07111f;
        }

        .form-container {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: #0d1b2e;
            border: 1px solid #203650;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .form-container h2 {
            margin: 0 0 10px;
            font-size: 30px;
            text-align: center;
            color: #f8fafc;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #94a3b8;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 19px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #33465e;
            border-radius: 10px;
            background: #091525;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            padding: 5px;
            border: none;
            background: transparent;
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .register-button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        .login-text {
            margin: 24px 0 0;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        .login-text a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 700;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .secure-note {
            margin-top: 24px;
            padding-top: 17px;
            border-top: 1px solid #203650;
            color: #64748b;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 21px;
            }

            nav {
                gap: 14px;
            }

            .form-container {
                padding: 27px 20px;
            }

            .form-container h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">JAI MART</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="register-wrapper">

    <div class="form-container">

        <h2>Create Account</h2>

        <p class="subtitle">
            Join JAI MART and start shopping today.
        </p>

        <form onsubmit="registerUser(event)">

            <div class="input-group">
                <label for="registerName">Full Name</label>
                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerEmail">Email Address</label>
                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerPhone">Phone Number</label>
                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="input-group">
                <label for="registerPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('registerPassword', this)"
                    >Show</button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                    >Show</button>
                </div>
            </div>

            <button type="submit" class="register-button">
                Create Account →
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <div class="secure-note">
            Welcome to JAI MART — Your shopping starts here.
        </div>

    </div>

</main>

<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }
</script>

<script src="script.js"></script>

</body>
</html>
```
